name: Daily News Digest

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 7:00am ET, every day
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run news digest
        run: python news_digest.py

      - name: Commit updated data
        run: |
          git config user.name "news-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/articles.json seen_article_ids.json
          git diff --cached --quiet || git commit -m "Update news digest $(date -u +%Y-%m-%d)"
          git push
